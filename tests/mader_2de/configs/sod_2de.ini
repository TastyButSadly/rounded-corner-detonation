; Mader 2DE verification case: Sod shock tube.
; Units used throughout this INI:
;   x_min, x_max, y_min, y_max, dx, dy - cm
;   tmax, dt_out - microseconds
;   density - g/cm^3
;   velocity_u, velocity_v - cm/microsecond
;   pressure - Mbar
;   temperature (computed in CSV output) - K
;   w - mass fraction of unreacted material, dimensionless

[SYSTEM]
case_name = mader_2de_sod
; Domain: 1.0 cm long tube, quasi-1D with three cells across y.
x_min = 0.0
x_max = 1.0
y_min = 0.0
y_max = 0.03
Nx = 100
Ny = 3
fict_x = 1
fict_y = 1
tmax = 0.2
cfl = 0.5
g = 1.4
dt_out = 0.0
step_num = 0
px = 1
py = 1
; Boundary type 1 = reflective.
boundary_type_left = 1
boundary_type_right = 1
boundary_type_up = 1
boundary_type_down = 1
equation_type = 9
analytic_axis = x
analytic_profile_index = 1
; Artificial viscosity coefficient, dimensionless.
mader_visc = 0.5
step_enabled = 0
reaction_enabled = 0
shargatov_correction = 0
default_w = 0.0
; Minimal allowed density as a fraction of the reference density rho0.
min_density_factor = 0.5

[INITIAL_CONDITIONS]
x_blocks_number = 2
y_blocks_number = 1

; Left state: rho = 1.0 g/cm^3, p = 1.0 Mbar.
BLOCK_1
x_begin = 0
x_end = 49
y_begin = 0
y_end = 2

density = 1.0
velocity_u = 0.0
velocity_v = 0.0
pressure = 1.0
w = 0.0

; Right state: rho = 0.125 g/cm^3, p = 0.1 Mbar.
BLOCK_2
x_begin = 50
x_end = 99
y_begin = 0
y_end = 2

density = 0.125
velocity_u = 0.0
velocity_v = 0.0
pressure = 0.1
w = 0.0
