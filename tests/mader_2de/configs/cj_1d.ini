; Mader 2DE verification case: 1D CJ-style detonation.
; Units used throughout this INI:
;   x_min, x_max, y_min, y_max - cm
;   tmax, dt_out - microseconds
;   density - g/cm^3
;   velocity_u, velocity_v - cm/microsecond
;   pressure - Mbar
;   gas_constant - Mbar*cm^3/(g*K)
;   reaction_rate - 1/microsecond
;   reaction_activation_energy - Mbar*cm^3/g
;   reaction_heat_release - Mbar*cm^3/g
;   min_temperature - K
;   w - mass fraction of unreacted material, dimensionless
;
; The kinetic package below is the frozen near-target setup used for presentable runs:
;   gas_constant = 5.0e-5
;   reaction_rate = 5.0e8
;   reaction_activation_energy = 1.0
;   reaction_heat_release = 0.0725
;   reaction_delay_steps = 0

[SYSTEM]
case_name = mader_2de_cj_1d
x_min = 0.0
x_max = 1.5
y_min = 0.0
y_max = 0.03
Nx = 200
Ny = 3
fict_x = 1
fict_y = 1
tmax = 0.35
cfl = 0.5
g = 3.0
dt_out = 0.02
step_num = 0
px = 1
py = 1
boundary_type_left = 1
boundary_type_right = 1
boundary_type_up = 1
boundary_type_down = 1
equation_type = 9
analytic_axis = x
analytic_profile_index = 1
mader_visc = 0.5
step_enabled = 0
reaction_enabled = 1
shargatov_correction = 0
default_w = 1.0
gas_constant = 0.00005
reaction_rate = 500000000.0
reaction_activation_energy = 1.0
reaction_heat_release = 0.0725
min_temperature = 1000.0
gasw_threshold = 0.02
reaction_delay_steps = 0
min_density_factor = 0.5

[INITIAL_CONDITIONS]
x_blocks_number = 2
y_blocks_number = 1

; Detonator slab: 5 left cells, products already reacted (w = 0).
; rho_det = rho0 * (gamma + 1) / gamma, p_det = D_CJ^2 * rho0 / (gamma + 1).
BLOCK_1
x_begin = 0
x_end = 4
y_begin = 0
y_end = 2

density = 2.453333333333333
velocity_u = 0.22
velocity_v = 0.0
pressure = 0.356464
w = 0.0

; Unreacted explosive.
BLOCK_2
x_begin = 5
x_end = 199
y_begin = 0
y_end = 2

density = 1.84
velocity_u = 0.0
velocity_v = 0.0
pressure = 0.0
w = 1.0
