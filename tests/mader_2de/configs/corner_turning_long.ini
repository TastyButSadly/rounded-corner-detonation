; Mader 2DE presentation case: corner turning at extended final time.
; Units used throughout this INI:
;   x_min, x_max, y_min, y_max - cm
;   tmax, dt_out - microseconds
;   density - g/cm^3
;   velocity_u, velocity_v - cm/microsecond
;   pressure - Mbar
;   gas_constant - Mbar*cm^3/(g*K)
;   reaction_rate - 1/microsecond
;   reaction_activation_energy - Mbar*cm^3/g
;   reaction_heat_release - Mbar*cm^3/g
;   min_temperature - K
;   w - mass fraction of unreacted material, dimensionless
;
; This is a presentation-only extension of corner_turning.ini.
; The physics setup is the same; only the observation window is much longer.

[SYSTEM]
case_name = mader_2de_corner_turning_long
x_min = 0.0
x_max = 7.0
y_min = 0.0
y_max = 4.0
Nx = 140
Ny = 80
fict_x = 1
fict_y = 1
tmax = 20.0
cfl = 0.5
g = 3.0
dt_out = 0.1
step_num = 0
px = 1
py = 1
boundary_type_left = 1
boundary_type_right = 1
boundary_type_up = 1
boundary_type_down = 1
equation_type = 9
analytic_axis = x
analytic_profile_index = 70
mader_visc = 0.5
step_enabled = 1
step_x_end = 2.0
step_y_end = 3.0
reaction_enabled = 1
shargatov_correction = 0
default_w = 1.0
gas_constant = 0.00005
reaction_rate = 500000000.0
reaction_activation_energy = 1.0
reaction_heat_release = 0.0725
min_temperature = 1000.0
gasw_threshold = 0.02
reaction_delay_steps = 0
min_density_factor = 0.5

[INITIAL_CONDITIONS]
x_blocks_number = 2
y_blocks_number = 1

BLOCK_1
x_begin = 0
x_end = 0
y_begin = 0
y_end = 79

density = 2.453333333333333
velocity_u = 0.22
velocity_v = 0.0
pressure = 0.356464
w = 0.0

BLOCK_2
x_begin = 1
x_end = 139
y_begin = 0
y_end = 79

density = 1.84
